        SHOW: True
        SHOW_UNIT: False
        X: 419
        Y: 167
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 16
        FONT_COLOR: 128, 255, 255
        BACKGROUND_IMAGE: background.png
  MEMORY:
    INTERVAL: 5
    VIRTUAL:
      GRAPH:
        SHOW: True
        X: 19
        Y: 266
        WIDTH: 80
        HEIGHT: 7
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 82, 255, 255
        BAR_OUTLINE: False
        BACKGROUND_COLOR: 8, 20, 66
      USED:
        SHOW: True
        SHOW_UNIT: True
        X: 22
        Y: 240
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 16
        FONT_COLOR: 128, 255, 255
        BACKGROUND_IMAGE: background.png
      RADIAL:
        SHOW: True
        X: 136
        Y: 250
        RADIUS: 31
        WIDTH: 5
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 120
        ANGLE_END: 60
        ANGLE_STEPS: 20
        ANGLE_SEP: 0
        CLOCKWISE: True
        BAR_COLOR: 255, 0, 173
        SHOW_TEXT: True
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 14
        FONT_COLOR: 128, 255, 255
        # BACKGROUND_COLOR: 0, 0, 0
        BACKGROUND_IMAGE: background.png
  DISK:
    INTERVAL: 10
    USED:
      GRAPH:
        SHOW: True
        X: 352
        Y: 93
        WIDTH: 110
        HEIGHT: 7
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 82, 255, 255
        BAR_OUTLINE: False
        BACKGROUND_IMAGE: background.png
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 390
        Y: 65
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 16
        FONT_COLOR: 128, 255, 255
        BACKGROUND_IMAGE: background.png
  NET:
    INTERVAL: 1
    ETH:
      UPLOAD:
        TEXT:
          SHOW: True
          X: 43
          Y: 65
          FONT: generale-mono/GeneraleMonoA.ttf
          FONT_SIZE: 16
          FONT_COLOR: 128, 255, 255
          BACKGROUND_IMAGE: background.png
      DOWNLOAD:
        TEXT:
          SHOW: True
          X: 43
          Y: 85
          FONT: generale-mono/GeneraleMonoA.ttf
          FONT_SIZE: 16
          FONT_COLOR: 128, 255, 255
          BACKGROUND_IMAGE: background.png
        LINE_GRAPH:
          SHOW: True
          X: 150
          Y: 30
          WIDTH: 200
          HEIGHT: 40
          MIN_VALUE: 0
          MAX_VALUE: 10000000 # 10MB/s
          HISTORY_SIZE: 100
          AUTOSCALE: True
          LINE_COLOR: '#7396d1'  # Change this to your desired color
          LINE_WIDTH: 2
          BACKGROUND_IMAGE: background.png
  DATE:
    INTERVAL: 1
    DAY:
      TEXT:
        SHOW: True
        X: 58
        Y: 10
        WIDTH: 100
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 12
        FONT_COLOR: 128, 255, 255
        BACKGROUND_IMAGE: background.png
        ANCHOR: mt  # Text is centered (needs fixed WIDTH)
    HOUR:
      TEXT:
        SHOW: True
        X: 325
        Y: 10
        WIDTH: 100
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 14
        FONT_COLOR: 128, 255, 255
        BACKGROUND_IMAGE: background.png
        ANCHOR: mt  # Text is centered (needs fixed WIDTH)
  UPTIME: # Uptime: Show the system uptime, either as a formatted string (e.g., "10 days, 5:30:15") or in total
    INTERVAL: 60 # Update every minute
    COMPACT:
      TEXT:
        SHOW: True
        X: 145
        Y: 285
        WIDTH: 200
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 16
        FONT_COLOR: 128, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt