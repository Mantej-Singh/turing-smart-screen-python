        SHOW: True
        X: 383
        Y: 266
        WIDTH: 78
        HEIGHT: 7
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 255, 0, 173
        BAR_OUTLINE: False
        BACKGROUND_COLOR: 8, 20, 66
      RADIAL:
        SHOW: True
        X: 348
        Y: 250
        RADIUS: 31
        WIDTH: 5
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 120
        ANGLE_END: 60
        ANGLE_STEPS: 20
        ANGLE_SEP: 0
        CLOCKWISE: True
        BAR_COLOR: 255, 0, 173
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 14
        FONT_COLOR: 128, 255, 255
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
