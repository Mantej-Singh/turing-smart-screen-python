---
author: "@mathoudebine"

display:
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 16, 223, 239

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
static_text:
  DISK_LABEL:
    TEXT: "JARVIS(C:)"
    X: 350
    Y: 36
    FONT: roboto/Roboto-Bold.ttf
    FONT_SIZE: 18
    FONT_COLOR: 16, 223, 239
    BACKGROUND_IMAGE: background.png
  DISK_USED_LABEL:
    TEXT: "Used:"
    X: 350
    Y: 67
    FONT: roboto/Roboto-Regular.ttf
    FONT_SIZE: 16
    FONT_COLOR: 16, 223, 239
    BACKGROUND_IMAGE: background.png
STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      RADIAL:
        SHOW: True
        X: 241
        Y: 154
        RADIUS: 52
        WIDTH: 5
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 120
        ANGLE_END: 60
        ANGLE_STEPS: 20
        ANGLE_SEP: 0
        CLOCKWISE: True
        BAR_COLOR: 255, 0, 173
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 22
        FONT_COLOR: 255, 0, 173
        BACKGROUND_IMAGE: background.png
    FREQUENCY:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: False
        #X: 200
        #Y: 260
        X: 97
        Y: 147
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 16
        FONT_COLOR: 128, 255, 255
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: False
        X: 22
        Y: 167
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 16
        FONT_COLOR: 128, 255, 255
        BACKGROUND_IMAGE: background.png
    LOADS:
      INTERVAL: 1
      "1":  # This is for the 1-minute load average
        LINE_GRAPH:
          # Graph of CPU load average over time, at the bottom-center
          SHOW: True
          X: 140      # (480/2) - (200/2)
          Y: 260      # 320 - 50 - 10 (height - margin)
          WIDTH: 200
          HEIGHT: 50
          MIN_VALUE: 0
          MAX_VALUE: 100
          HISTORY_SIZE: 100
          LINE_COLOR: 16, 223, 239  # A blue from the theme
          LINE_WIDTH: 2
  GPU:
    INTERVAL: 1
    PERCENTAGE:
      RADIAL:
        SHOW: True
        X: 366
        Y: 155
        RADIUS: 35
        WIDTH: 7
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 120
        ANGLE_END: 60
        ANGLE_STEPS: 20
        ANGLE_SEP: 0
        CLOCKWISE: True
        BAR_COLOR: 255, 0, 173
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 16
        FONT_COLOR: 128, 255, 255
        # BACKGROUND_COLOR: 0, 0, 0
        BACKGROUND_IMAGE: background.png
      LINE_GRAPH:
        # Graph of GPU usage over time, at the bottom-center
        SHOW: True
        X: 165      # RE-CENTERED for new width
        Y: 225      # MOVED down to fit better from 220
        WIDTH: 150  # SHORTENED to avoid collisions
        HEIGHT: 50
        MIN_VALUE: 0
        MAX_VALUE: 100
        HISTORY_SIZE: 100
        AUTOSCALE: True  # ADDED to "zoom in" on data
        LINE_COLOR: 255, 0, 0  # CHANGED to red
        LINE_WIDTH: 2
        BACKGROUND_IMAGE: background.png  # ADDED for transparent background
    MEMORY_USED:
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 386
        Y: 240
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 16
        FONT_COLOR: 128, 255, 255
        BACKGROUND_IMAGE: background.png
    MEMORY_PERCENT:
